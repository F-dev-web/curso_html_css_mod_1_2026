<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border-width: 10px;
            border-style: solid;
            border-color: lightblue;
            /* Podemos simplificar usando as shorthands
            border: 10px solid lightblue;
            */

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /* Podemos simplificar usando as shorthands
            padding: 10px; qdo todas as medidas são iguais
            */

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

            outline-width: 10px;
            outline-style: dotted;
            outline-color: lightgreen;
            /*Shorthand de outline
            outline: 10px dotted lightgreen;
            */
        }
        a {
            border-width: 10px;
            border-style: solid;  
            border-color: red;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /* Podemos simplificar usando as shorthands
            padding: 10px;
            */
        }
    </style>
</head>
<body>
    <h1>Exemplos de caixa box-level</h1>
    <p>Parágrafos também são um exemplo de box-level, mas os <a href="#">links</a> são exemplos de inline-level, vamos ver como funcionam.</p>
</body>
</html>
